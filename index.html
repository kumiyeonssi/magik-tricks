<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Gallery</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f3;
      color: #1a1a18;
      min-height: 100vh;
      padding: 2.5rem 1.5rem;
    }

    header {
      max-width: 960px;
      margin: 0 auto 2rem;
    }

    header p {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #888780;
      margin-bottom: .4rem;
    }

    header h1 {
      font-size: 22px;
      font-weight: 500;
      color: #1a1a18;
    }

    .vid-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.25rem;
      max-width: 960px;
      margin: 0 auto;
    }

    .vid-card {
      background: #fff;
      border: 0.5px solid rgba(0,0,0,0.12);
      border-radius: 12px;
      overflow: hidden;
    }

    .vid-wrap {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
    }

    .vid-wrap iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }

    .vid-meta {
      padding: .75rem 1rem;
    }

    .vid-meta strong {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #1a1a18;
    }

    .vid-meta span {
      font-size: 13px;
      color: #888780;
    }

    @media (prefers-color-scheme: dark) {
      body { background: #1a1a18; color: #f1efe8; }
      header h1 { color: #f1efe8; }
      .vid-card { background: #2c2c2a; border-color: rgba(255,255,255,0.1); }
      .vid-meta strong { color: #f1efe8; }
    }
  </style>
</head>
<body>

  <header>
    <p>Featured videos</p>
    <h1>Video Gallery</h1>
  </header>

  <div class="vid-grid">

    <div class="vid-card">
      <div class="vid-wrap">
        <iframe src="https://www.youtube.com/embed/TcgwZKImVec"
          title="Rick Astley – Never Gonna Give You Up"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen></iframe>
      </div>
      <div class="vid-meta">
        <strong>Never Gonna Give You Up</strong>
        <span>Rick Astley · YouTube</span>
      </div>
    </div>

    <div class="vid-card">
      <div class="vid-wrap">
        <iframe src="https://www.youtube.com/embed/TcgwZKImVec"
          title="PSY – GANGNAM STYLE"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen></iframe>
      </div>
      <div class="vid-meta">
        <strong>GANGNAM STYLE</strong>
        <span>PSY · YouTube</span>
      </div>
    </div>

    <div class="vid-card">
      <div class="vid-wrap">
        <iframe src="https://www.youtube.com/embed/TcgwZKImVec"
          title="Shape of You – Ed Sheeran"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen></iframe>
      </div>
      <div class="vid-meta">
        <strong>Shape of You</strong>
        <span>Ed Sheeran · YouTube</span>
      </div>
    </div>

    <div class="vid-card">
      <div class="vid-wrap">
        <iframe src="https://www.youtube.com/embed/TcgwZKImVec"
          title="The Mountain – Vimeo"
          allow="autoplay; fullscreen; picture-in-picture"
          allowfullscreen></iframe>
      </div>
      <div class="vid-meta">
        <strong>The Mountain</strong>
        <span>Terje Sorgjerd · Vimeo</span>
      </div>
    </div>

     <div class="vid-card">
      <div class="vid-wrap">
        <iframe src="https://www.youtube.com/embed/TcgwZKImVec"
          title="The Mountain – Vimeo"
          allow="autoplay; fullscreen; picture-in-picture"
          allowfullscreen></iframe>
      </div>
      <div class="vid-meta">
        <strong>The Mountain</strong>
        <span>Terje Sorgjerd · Vimeo</span>
      </div>
    </div>

     <div class="vid-card">
      <div class="vid-wrap">
        <iframe src="https://www.youtube.com/embed/TcgwZKImVec"
          title="The Mountain – Vimeo"
          allow="autoplay; fullscreen; picture-in-picture"
          allowfullscreen></iframe>
      </div>
      <div class="vid-meta">
        <strong>The Mountain</strong>

    </div>

  </div>

</body>
</html>
